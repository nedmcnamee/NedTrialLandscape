# NedTrialLandscape configuration
# This is the only file you should normally need to edit.

site:
  title: "ANZ + global cancer trial landscape"
  subtitle: "Drug target x tissue, curative vs advanced intent"
  # Shown in the page footer. ARTiCANZ is CC BY 4.0 and requires attribution.
  attribution: >
    ANZ trial data from ARTICANZ (articanz.org), CC BY 4.0.
    Global data from ClinicalTrials.gov API v2.

sources:
  articanz:
    enabled: true
    # ARTiCANZ refreshes Fridays; the workflow runs Saturday AEST.
    datasets:
      advanced: "https://articanz.org/data/ARTICANZ-trials-summary-extra-advanced.tsv"
      curative: "https://articanz.org/data/ARTICANZ-trials-summary-extra-curative.tsv"
    # Label shown on the panel split in the heatmap
    intent_labels:
      advanced: "Advanced / non-curative"
      curative: "Curative intent"
  ctgov:
    enabled: true
    start_date: "2018-01-01"
    phases: ["PHASE1", "PHASE2", "PHASE3"]
    # Excluded from the primary set (v9 behaviour)
    exclude_statuses: ["WITHDRAWN", "TERMINATED", "SUSPENDED", "UNKNOWN"]
    exclude_not_yet_recruiting: true
    exclude_haematological: true

display:
  # Modality shown when the page first loads
  default_modality: "Antibody-drug conjugate"
  default_min_trials_per_target: 2
  default_max_targets: 25
  group_tissues_by_default: true

