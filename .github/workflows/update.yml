name: Update trial landscape

on:
  schedule:
    # ARTiCANZ refreshes on Fridays (AEST). Run Saturday 07:00 AEST = 21:00 UTC Friday.
    - cron: "0 21 * * 5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config.yaml"
      - "src/**"
      - "docs/index.html"
      - ".github/workflows/update.yml"

permissions:
  contents: write
  pages: write
  id-token: write

# One run at a time. Without this a push-triggered run and a manual run can
# build in parallel and race each other to push.
concurrency:
  group: update-trial-landscape
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build data
        run: python src/build.py

      - name: Validate
        run: python src/validate.py

      # Uses ARTiCANZ's curated ADC calls as ground truth for the
      # ClinicalTrials.gov regex. Prints missed trials and their drug names.
      - name: Cross-registry recall audit
        run: python src/recall.py

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # docs/data.json, docs/recall.json and data/seen.json are generated
          # artifacts: the copy we just built always wins. Rebasing would try to
          # merge two machine-written JSON blobs, so instead reset HEAD onto
          # whatever the remote is now and re-commit our files on top. No
          # conflict is possible.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --soft origin/main
            git add docs/data.json docs/recall.json data/seen.json
            if git diff --staged --quiet; then
              echo "No changes this run."
              exit 0
            fi
            git commit -m "Weekly refresh $(date -u +%Y-%m-%d)"
            if git push origin main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Remote moved while we were building; retrying ($attempt/3)."
            sleep 5
          done
          echo "Could not push after 3 attempts."
          exit 1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
