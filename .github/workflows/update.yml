name: Update trial landscape

on:
  schedule:
    # ARTiCANZ refreshes on Fridays (AEST). Run Saturday 07:00 AEST = 21:00 UTC Friday.
    - cron: "0 21 * * 5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config.yaml"
      - "src/**"
      - "docs/index.html"
      - ".github/workflows/update.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build data
        run: python src/build.py

      - name: Validate
        run: python src/validate.py

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json data/seen.json
          if git diff --staged --quiet; then
            echo "No changes this run."
          else
            git commit -m "Weekly refresh $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
